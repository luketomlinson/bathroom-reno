<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIY Master Bath Reno — Before &amp; After</title>
  <meta name="description" content="A before-and-after look at our DIY master bathroom renovation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>DIY Master Bath Reno</h1>
    </header>

    <section
      class="compare"
      aria-label="Before and after comparison of the bathroom"
    >
      <figure
        class="ba"
        id="ba"
        style="--pos: 50%"
      >
        <img
          class="ba__img ba__img--after"
          id="imgAfter"
          src="images/full-after.jpg"
          alt="The full room after renovation"
          draggable="false"
          decoding="async"
        />
        <img
          class="ba__img ba__img--before"
          id="imgBefore"
          src="images/full-before.jpg"
          alt="The full room before renovation"
          draggable="false"
          decoding="async"
        />

        <span class="ba__label ba__label--before" aria-hidden="true">Before</span>
        <span class="ba__label ba__label--after" aria-hidden="true">After</span>

        <button
          type="button"
          class="ba__handle"
          id="baHandle"
          role="slider"
          aria-label="Reveal before or after"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
          aria-valuetext="Halfway between before and after"
        >
          <span class="ba__grip" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="10 7 5 12 10 17" />
              <polyline points="14 7 19 12 14 17" />
            </svg>
          </span>
        </button>
      </figure>

      <div class="compare__bar">
        <p class="compare__caption" id="caption">The full room</p>
        <p class="compare__hint" id="hint">Drag, or focus the handle and use ← →</p>
      </div>

      <div class="scenes" role="group" aria-label="Choose a view to compare">
        <button
          type="button"
          class="scene is-active"
          aria-current="true"
          data-before="images/full-before.jpg"
          data-after="images/full-after.jpg"
          data-title="The full room"
        >
          <img src="images/full-after.jpg" alt="" loading="lazy" />
          <span class="scene__name">Full room</span>
        </button>
        <button
          type="button"
          class="scene"
          data-before="images/vanity-before.jpg"
          data-after="images/vanity-after.jpg"
          data-title="Vanity &amp; mirror"
        >
          <img src="images/vanity-after.jpg" alt="" loading="lazy" />
          <span class="scene__name">Vanity</span>
        </button>
        <button
          type="button"
          class="scene"
          data-before="images/shower-before.jpg"
          data-after="images/shower-after.jpg"
          data-title="Walk-in shower"
        >
          <img src="images/shower-after.jpg" alt="" loading="lazy" />
          <span class="scene__name">Shower</span>
        </button>
      </div>
    </section>

    <section class="progress" id="progress" hidden aria-label="Renovation progress photos">
      <div class="section-head">
        <p class="eyebrow">Behind the scenes</p>
        <h2>The process</h2>
        <p class="lede">A few shots from the work in between — demo to done.</p>
      </div>
      <div class="progress__grid" id="progressGrid"></div>
    </section>

    <footer class="footer">
      <p>Built with a little HTML, CSS, and a Saturday of tiling.</p>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
